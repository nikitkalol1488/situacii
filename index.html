button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
@keyframes jit{0%{transform:rotate(var(--r,0deg))}33%{transform:rotate(calc(var(--r,0deg) + 2deg)) translate(1.5px,-1px)}66%{transform:rotate(calc(var(--r,0deg) - 1.6deg)) translate(-1px,1.5px)}}

/* фон */
#decor{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#decor i{position:absolute;animation:jit .8s steps(1) infinite;font-style:normal}
.s1{width:270px;height:250px;top:-70px;right:-100px;background:var(--pink);border-radius:47% 53% 42% 58%/55% 44% 56% 45%;--r:8deg}
.s2{width:44px;height:330px;left:-10px;top:30%;background:var(--blue);--r:14deg;animation-delay:-.3s!important;clip-path:polygon(0 2%,100% 0,94% 100%,6% 98%)}
.s3{width:120px;height:120px;right:3%;bottom:5%;background:var(--red);--r:-10deg;animation-delay:-.5s!important;clip-path:polygon(50% 0,61% 34%,97% 30%,69% 54%,82% 90%,50% 69%,18% 92%,31% 55%,3% 32%,39% 34%)}
.s4{width:170px;height:170px;left:-56px;bottom:-56px;background:var(--yel);border-radius:52% 48% 55% 45%/46% 54% 44% 56%;animation-delay:-.15s!important}
.s5{width:130px;height:20px;left:18%;top:26px;background:var(--ink);--r:-4deg;clip-path:polygon(0 50%,8% 0,16% 100%,24% 0,32% 100%,40% 0,48% 100%,56% 0,64% 100%,72% 0,80% 100%,88% 0,100% 60%,88% 100%,80% 40%,72% 100%,64% 40%,56% 100%,48% 40%,40% 100%,32% 40%,24% 100%,16% 40%,8% 100%)}

/* сцена */
#stage{position:fixed;inset:0;z-index:1;display:grid;place-items:center;padding:calc(30px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));perspective:1100px;overflow:hidden}
#stage.long{place-items:start center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(34px + env(safe-area-inset-top));padding-bottom:60px}
.screen{grid-area:1/1;width:100%;max-width:430px;position:relative;transform-origin:50% 100%}
.sheet{filter:drop-shadow(4px 6px 0 rgba(29,24,20,.17));position:relative}
.sheet::before{content:"";position:absolute;z-index:2;top:-12px;left:50%;width:96px;height:28px;margin-left:-48px;background:rgba(255,207,58,.85);transform:rotate(-3deg);clip-path:polygon(2% 0,98% 6%,100% 94%,0 100%)}
.card{position:relative;background:var(--paper);padding:34px 22px 28px;transform:rotate(var(--rot,-1deg));clip-path:polygon(0% 1.2%,3% .4%,7% 1.3%,12% .2%,18% 1.1%,24% .3%,31% 1.2%,38% .5%,45% 1.4%,52% .3%,60% 1%,67% .2%,74% 1.2%,81% .4%,88% 1.3%,94% .3%,100% 1%,99.3% 20%,100% 40%,99.2% 60%,100% 80%,99.5% 99%,95% 99.8%,89% 98.9%,82% 99.7%,75% 98.8%,68% 99.8%,60% 99%,52% 99.7%,44% 98.8%,36% 99.6%,28% 98.9%,20% 99.8%,13% 99%,6% 99.7%,0% 98.9%,.7% 80%,0% 60%,.8% 40%,0% 20%)}
.screen.enter{animation:cutin .7s cubic-bezier(.2,1.5,.4,1) .12s both}
.screen.leave{animation:cutout .5s cubic-bezier(.6,0,.9,.4) both;pointer-events:none}
.screen.enter.soft{animation:softin .5s ease .15s both}
.screen.leave.soft{animation:softout .3s ease both}
@keyframes cutin{from{transform:translateY(30%) rotateX(-88deg) rotate(-5deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes cutout{to{transform:translate(-40%,115vh) rotate(-28deg)}}
@keyframes softin{from{opacity:0;transform:translateY(24px)}}
@keyframes softout{to{opacity:0;transform:translateY(-24px)}}

/* типографика */
.kicker{font:700 25px Caveat;color:var(--ch);transform:rotate(-3deg);display:inline-block;margin-bottom:6px}
.title{font:400 32px/1.08 Dela;letter-spacing:-.01em}
.title em,h3 em{font-style:normal;background:var(--yel);padding:0 6px;display:inline-block;transform:rotate(-2deg)}
.lead{margin-top:14px;font-size:16.5px;line-height:1.42}
.chnum{font:400 86px/1 Dela;color:var(--ch);display:inline-block;transform:rotate(-5deg);margin-bottom:6px}
.qtext{font:400 19px/1.3 Dela;margin-bottom:18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.prog{display:flex;gap:6px}
.prog i{width:12px;height:12px;background:#E7DAC2;transform:rotate(calc(var(--n)*23deg))}
.prog i.on{background:var(--ch)}
.pnum{font:700 21px Caveat;white-space:nowrap}
.hand{font:600 21px/1.2 Caveat}
.note{font-size:12.5px;line-height:1.4;opacity:.65;margin-top:12px}

/* кнопки и ответы */
.btn{display:inline-block;margin-top:20px;background:var(--ink);color:#fff;font:400 16px Dela;padding:14px 24px 15px;clip-path:polygon(0 6%,100% 0,98% 100%,2% 94%);transition:transform .12s;text-align:center}
.btn:active{transform:rotate(-2deg) scale(.96)}
.btn.alt{background:var(--yel);color:var(--ink)}
.btn.sm{font-size:13.5px;padding:11px 16px 12px;margin-top:10px}
.btn + .btn{margin-left:8px}
.link{display:inline-block;margin-top:16px;font:600 21px Caveat;border-bottom:2px solid currentColor;line-height:1.05}
.back{font:600 20px Caveat;margin-top:14px;opacity:.7}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;position:relative;background:var(--strip);padding:14px 44px 14px 20px;font-size:16.5px;line-height:1.3;clip-path:polygon(0 4%,100% 0,99% 96%,1% 100%);transition:transform .15s,background .15s,opacity .3s}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--blue)}
.opt:nth-child(2)::before{background:var(--pink)}
.opt:nth-child(3)::before{background:var(--red)}
.opt:active{transform:scale(.98)}
.opt.was{background:#FBEFC0}
.opt.sel{background:var(--yel);transform:rotate(-1.4deg) scale(1.02)}
.opt.sel::after{content:"";position:absolute;right:9px;top:50%;width:30px;height:30px;margin-top:-15px;background:var(--red);clip-path:polygon(50% 0,61% 34%,97% 30%,69% 54%,82% 90%,50% 69%,18% 92%,31% 55%,3% 32%,39% 34%);animation:starpop .45s steps(4) both,jit .5s steps(1) .45s infinite}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.answered .opt:not(.sel){opacity:.32}
input.name,textarea.code{display:block;width:100%;margin-top:16px;font:400 20px Dela;color:var(--ink);background:var(--strip);border:0;border-bottom:4px solid var(--ink);padding:12px 12px 10px;border-radius:0;outline:none}
textarea.code{font:500 15px/1.35 ui-monospace,Menlo,Consolas,monospace;height:84px;resize:none}
.err{color:var(--red);font:600 20px Caveat;margin-top:8px;min-height:22px}

/* результат */
.rhead{padding:6px 4px 4px}
.rc{margin:26px 0 0;opacity:0}
.rc.in{opacity:1;animation:cutin .7s cubic-bezier(.2,1.4,.4,1) both;transform-origin:50% 100%}
.rc:nth-child(even) .card{--rot:.8deg}
.rc .card{padding:30px 20px 24px}
.rc h3{font:400 23px/1.12 Dela;margin:2px 0 10px}
.rc p{font-size:16px;line-height:1.45;margin-top:9px}
.rc p.hand{font-size:22px;line-height:1.2}

.legend{display:flex;gap:16px;margin-top:12px;font:700 21px Caveat}

.line .ends{display:flex;justify-content:space-between;font:600 19px Caveat}
.rail{position:relative;height:6px;background:var(--ink);margin:20px 12px 18px;clip-path:polygon(0 20%,100% 0,100% 100%,0 80%);overflow:visible}

.mk{position:absolute;top:50%;left:calc(12px + (100% - 24px) * var(--x));width:30px;height:30px;margin:-15px 0 0 -15px;background:var(--ch);color:#fff;font:400 13px/30px Dela;text-align:center;border-radius:47% 53% 50% 50%/52% 48% 55% 45%;font-style:normal;transform:scale(0)}
.mk.a{background:var(--pink)}.mk.b{background:var(--blue)}
.in .mk{animation:starpop .5s steps(4) .5s both}
.in .mk.b{animation-delay:.75s}
ul.ins{list-style:none;margin-top:8px}
ul.ins li{position:relative;padding:9px 0 9px 26px;font-size:16px;line-height:1.35;border-bottom:2px dashed #E3D6BD}
ul.ins li:last-child{border-bottom:0}
ul.ins li::before{content:"";position:absolute;left:2px;top:14px;width:13px;height:13px;background:var(--ch);transform:rotate(12deg)}

.pairrow:last-child{border-bottom:0}

const AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function csum(b){let c=0;for(let i=0;i<b.length;i++)c=(c*7+AB.indexOf(b[i])+i)%32;return AB[c]}
function encode(p){let n=0;for(const a of p.ans)n=n*3+a;let s='';for(let i=0;i<10;i++){s=AB[n%32]+s;n=Math.floor(n/32)}
 let bits='',t='';for(const b of new TextEncoder().encode(p.name))bits+=b.toString(2).padStart(8,'0');while(bits.length%5)bits+='0';
 for(let i=0;i<bits.length;i+=5)t+=AB[parseInt(bits.slice(i,i+5),2)];
 const body=s+t;return('T'+body+csum(body)).match(/.{1,5}/g).join('-')}
function decode(code){const raw=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');if(raw[0]!=='T'||raw.length<13)return null;
 const body=raw.slice(1,-1);for(const ch of body)if(AB.indexOf(ch)<0)return null;if(csum(body)!==raw.slice(-1))return null;
 let n=0;for(const ch of body.slice(0,10))n=n*32+AB.indexOf(ch);const ans=new Array(30);for(let i=29;i>=0;i--){ans[i]=n%3;n=Math.floor(n/3)}if(n!==0)return null;
 let bits='';for(const ch of body.slice(10))bits+=AB.indexOf(ch).toString(2).padStart(5,'0');const bytes=[];for(let i=0;i+8<=bits.length;i+=8)bytes.push(parseInt(bits.slice(i,i+8),2));
 let name='';try{name=new TextDecoder().decode(new Uint8Array(bytes)).replace(/\0/g,'')}catch(e){}
 return {name:name||'Гость',ans}}
function extract(text){const out=[],seen={};const t=String(text||'');const part=t.indexOf('#')>=0?t.slice(t.lastIndexOf('#')+1):t;
 (part.toUpperCase().match(/T[A-Z2-9]{4}(?:-[A-Z2-9]{1,5}){2,}/g)||[]).forEach(c=>{const d=decode(c);if(d){const k=encode(d);if(!seen[k]){seen[k]=1;d.code=k;out.push(d)}}});return out}
const ONLINE=/^https?:/.test(location.protocol);
function linkFor(codes){return ONLINE?location.origin+location.pathname+'#'+codes.join('.'):null}

/* ---------- подсчёт ---------- */
function score(ans){
 const vc={S:0,W:0,O:0,D:0},ve={S:6,W:4,O:4,D:4},kc={C:0,L:0,A:0,P:0},ke={C:5,L:4,A:5,P:4};let m=0,d=0,w=0;
 Q.forEach((q,i)=>{const g=q[3][ans[i]];if(q[0]===0)vc[g]++;else if(q[0]===1)kc[g]++;else if(q[0]===2){if(i<16)m+=+g}else if(q[0]===3){if(i<21)d+=+g;else w+=+g}});
 const rank=(c,e)=>Object.keys(c).map(k=>({k,n:c[k],s:c[k]/e[k]})).sort((x,y)=>y.s-x.s||y.n-x.n);
 return {v:rank(vc,ve),k:rank(kc,ke),m,chrono:m<=2?'owl':m<=5?'mid':'lark',tempo:ans[16],charge:ans[17],d,w,quad:(d>=3?'H':'L')+(w>=3?'H':'L'),i:ans.slice(24,30)}
}
const byKey=(arr,k)=>arr.find(x=>x.k===k);

/* ---------- состояние ---------- */
let me=LS.get('me')||{name:'',ans:[]};
let partner=LS.get('partner')||null; // {name,ans,code}
const done=()=>me.name&&me.ans.length===30&&me.ans.every(a=>a===0||a===1||a===2);
const firstOpen=()=>{for(let i=0;i<30;i++)if(!(me.ans[i]>=0))return i;return 30};
const save=()=>LS.set('me',me);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stage=document.getElementById('stage');
let lock=false;

function show(html,o){o=o||{};
 const old=stage.querySelector('.screen:not(.leave)');
 if(old){old.classList.remove('enter');old.classList.add('leave');if(o.long||stage.classList.contains('long'))old.classList.add('soft');setTimeout(()=>old.remove(),560)}
 const el=document.createElement('section');el.className='screen enter'+(o.long?' soft':'');
 document.documentElement.style.setProperty('--ch',o.col||'#FF4F9A');
 el.innerHTML=o.long?html:`<div class="sheet"><div class="card" style="--rot:${(Math.random()*2.2-1.3).toFixed(2)}deg">${html}</div></div>`;
 setTimeout(()=>{stage.classList.toggle('long',!!o.long);stage.scrollTop=0;stage.appendChild(el);if(o.long)reveal(el);if(o.after)o.after(el);setTimeout(()=>el.classList.remove('enter'),1200)},old?(o.long?300:60):0);
 setTimeout(()=>lock=false,600);
}
function reveal(root){const items=root.querySelectorAll('.rc');
 if(!('IntersectionObserver' in window)){items.forEach(x=>x.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:stage,threshold:.12});
 items.forEach(x=>io.observe(x))}
function confetti(){const cols=['#FF4F9A','#2E4BE0','#F2452E','#FFCF3A','#1FA36B'];
 for(let i=0;i<28;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-delay:${(Math.random()*.9).toFixed(2)}s;transform:rotate(${Math.random()*90}deg)`;document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}}

/* ---------- экраны ---------- */
function cover(){
 const p=partner&&(!done()||partner.code!==encode(me))?partner:null;
 let h=`<div class="kicker">тест</div><h1 class="title">30 ситуаций <em>про тебя</em></h1><p class="lead">Отвечай, как поступаешь ты, а не как правильно. Займёт минут пять.</p>`;
 if(p)h+=`<p class="hand" style="margin-top:12px">Тебе пришёл результат: ${esc(p.name)}. В конце сравните ответы.</p>`;
 if(done())h+=`<button class="btn" data-act="result">Мой результат</button>`+(p?`<button class="btn alt" data-act="pair">Сравнить</button>`:'')+`<br><button class="link" data-act="again">пройти заново</button>`;
 else if(firstOpen()>0&&me.name)h+=`<button class="btn" data-act="resume">Продолжить</button><br><button class="link" data-act="again">начать сначала</button>`;
 else h+=`<button class="btn" data-act="start">Начать</button>`;
 h+=`<br><button class="link" data-act="code">у меня есть код</button>`;
 show(h)}
function nameScreen(){show(`<div class="kicker">для начала</div><h1 class="title">Как тебя <em>зовут?</em></h1><p class="lead">Имя будет стоять в твоём результате.</p>
 <input class="name" id="nm" maxlength="12" autocomplete="off" placeholder="Имя" value="${esc(me.name)}"><div class="err" id="er"></div><button class="btn" data-act="name">Дальше</button>`)}
function chapter(c){const ch=CH[c];show(`<div class="kicker">глава ${c+1} из 5</div><br><div class="chnum">0${c+1}</div><h1 class="title">${ch.title}</h1><p class="lead">${ch.lead}</p><button class="btn" data-act="q" data-q="${c*6}">Поехали</button>`,{col:ch.col})}
function question(i){const q=Q[i],ch=CH[q[0]];let pr='';for(let k=0;k<6;k++)pr+=`<i style="--n:${k}" class="${k<=i%6?'on':''}"></i>`;
 show(`<div class="meta"><div class="prog">${pr}</div><div class="pnum">${i+1} / 30</div></div><div class="kicker">${ch.kick}</div><h2 class="qtext">${q[1]}</h2>
 <div class="opts">${q[2].map((o,k)=>`<button class="opt${me.ans[i]===k?' was':''}" data-act="pick" data-q="${i}" data-k="${k}">${o}</button>`).join('')}</div>
 <button class="back" data-act="back" data-q="${i}">← назад</button>`,{col:ch.col})}
function go(i){if(i>=30)return result(true);if(i%6===0&&!(me.ans[i]>=0))return chapter(i/6);question(i)}

const bar=(label,w,val)=>`<div class="bar"><b>${label}</b><em>${val||''}</em><span class="track"><i style="--w:${w}%"></i></span></div>`;
const bar2=(label,a,b)=>`<div class="bar"><b>${label}</b><em></em><span class="track thin"><i class="a" style="--w:${a}%"></i></span><span class="track thin"><i class="b" style="--w:${b}%"></i></span></div>`;
const line=(l,r,marks)=>`<div class="line"><div class="ends"><span>${l}</span><span>${r}</span></div><div class="railwrap"><div class="rail"></div>${marks}</div></div>`;
const mk=(x,cls,t)=>`<i class="mk ${cls}" style="--x:${x}">${esc(t)}</i>`;
const ini=n=>(n||'?').trim().charAt(0).toUpperCase();
const mk2=(xa,xb,A,B)=>{if(Math.abs(xa-xb)<.1){const m=(xa+xb)/2,c=Math.min(.95,Math.max(.05,m));xa=c-.05;xb=c+.05}return mk(xa,'a',ini(A.name))+mk(xb,'b',ini(B.name))};
const sec=(col,html)=>`<section class="rc" style="--ch:${col}"><div class="sheet"><div class="card">${html}</div></div></section>`;
const pct=x=>Math.max(6,Math.round(x*100));

function shareBlock(){
 const my=encode(me);let h=`<div class="kicker">сравнение</div><h3>Сравнить <em>ответы</em></h3>`;
 if(partner&&partner.code!==my)h+=`<p>У тебя уже есть результат: ${esc(partner.name)}.</p><button class="btn alt" data-act="pair">Сравнить: ${esc(me.name)} × ${esc(partner.name)}</button>`;
 h+=`<p><b>1.</b> Отправь ${ONLINE?'свою ссылку':'свой код'} человеку, с которым хочешь сравнить ответы. Он пройдёт тест и сразу увидит сравнение.</p>
 <button class="btn sm" data-act="share" data-what="me">Отправить</button><button class="btn sm alt" data-act="copy" data-what="me">Скопировать</button>
 <p style="margin-top:18px"><b>2.</b> Если ${ONLINE?'ссылку':'код'} прислали тебе, вставь сюда:</p>
 <textarea class="code" id="cd" placeholder="${ONLINE?'ссылка или код':'код'}"></textarea><div class="err" id="er"></div><button class="btn sm" data-act="usecode">Сравнить</button>`;
 return h}

function result(fresh){
 const s=score(me.ans),v0=s.v[0],v1=s.v[1],k0=s.k[0];
 let h=`<div class="rhead"><div class="kicker">результат</div><h1 class="title">${esc(me.name)}, вот <em>твой портрет</em></h1><p class="lead">Пять глав, пять коротких выводов. В конце можно сравнить ответы с другим человеком.</p>${partner&&partner.code!==encode(me)?`<button class="btn alt" data-act="pair">Сравнить: ${esc(me.name)} × ${esc(partner.name)}</button>`:''}</div>`;
 h+=sec(CH[0].col,`<div class="kicker">${CH[0].kick}</div><h3>${VG[v0.k].n}</h3><p>${VG[v0.k].t}</p><p>На втором месте: ${VG[v1.k].n.toLowerCase()}.</p><div class="bars">${'SWOD'.split('').map(k=>bar(VG[k].n,pct(byKey(s.v,k).s))).join('')}</div>`);
 h+=sec(CH[1].col,`<div class="kicker">${CH[1].kick}</div><h3>${KS[k0.k].n}</h3><p>${KS[k0.k].t}</p><div class="bars">${'CLAP'.split('').map(k=>bar(KS[k].n,pct(byKey(s.k,k).s))).join('')}</div>`);
 h+=sec(CH[2].col,`<div class="kicker">${CH[2].kick}</div><h3>${RC[s.chrono].n}</h3><p>${RC[s.chrono].t}</p>${line('ночь','утро',mk(s.m/8,'',ini(me.name)))}<p>${TEMPO[s.tempo]}</p><p>${CHARGE[s.charge]}</p>`);
 h+=sec(CH[3].col,`<div class="kicker">${CH[3].kick}</div><h3>${PQ[s.quad].n}</h3><p>${PQ[s.quad].t}</p>${line('подпускаю быстро','долго',mk(s.d/6,'',ini(me.name)))}${line('паузы не трогают','накручиваю',mk(s.w/6,'',ini(me.name)))}`);
 h+=sec(CH[4].col,`<div class="kicker">${CH[4].kick}</div><h3>Инструкция к тебе</h3><ul class="ins">${s.i.map((a,n)=>`<li>${INS[n][a]}</li>`).join('')}</ul><p class="hand">Покажи её тому, кому она пригодится.</p>`);
 h+=sec('#FF4F9A',shareBlock());
 h+=`<p class="foot">Вопросы составлены по мотивам научных опросников: ценности — Шалом Шварц, поведение в споре — Томас и Килманн, режим дня — шкала «утро — вечер» Хорна и Эстберга, близость — шкала ECR. Последняя глава авторская. Тест короткий, поэтому это набросок, а не диагноз.</p><button class="link" data-act="home" style="margin-left:4px">в начало</button>`;
 show(h,{long:true});if(fresh)setTimeout(confetti,400)}

function pair(A,B){
 if(A.name===B.name)B=Object.assign({},B,{name:B.name+' 2'});
 const a=score(A.ans),b=score(B.ans),an=esc(A.name),bn=esc(B.name);
 const same=[0,0,0,0,0];let tot=0;for(let i=0;i<30;i++)if(A.ans[i]===B.ans[i]){same[Q[i][0]]++;tot++}
 const names=['Ценности','Спор','Ритм','Люди','Инструкция'];const mx=same.indexOf(Math.max.apply(null,same)),mn=same.indexOf(Math.min.apply(null,same));
 const legend=`<div class="legend"><span class="la">${an}</span><span class="lb">${bn}</span></div>`;
 let h=`<div class="rhead"><div class="kicker">сравнение</div><h1 class="title">${an} <em>×</em> ${bn}</h1></div>`;
 h+=sec('#FF4F9A',`<div class="kicker">в цифрах</div><br><div class="bignum"><span id="cnt">0</span><small>из 30</small></div><p>На столько вопросов вы ответили одинаково. Это не оценка, а карта: где вы похожи и где разные.</p>
 <div class="bars">${names.map((n,i)=>`<div style="--ch:${CH[i].col}">${bar(n,Math.max(4,same[i]/6*100),same[i]+' из 6')}</div>`).join('')}</div>
 <p>${same[mx]===same[mn]?'Во всех главах совпадений поровну.':`Больше всего общего в главе «${names[mx].toLowerCase()}», меньше всего — в главе «${names[mn].toLowerCase()}».`}</p>`);
 // ценности
 const va=a.v[0].k,vb=b.v[0].k;
 const vt=va===vb?`У вас один главный мотор: «${VG[va].n.toLowerCase()}». ${VG[va].both}`:`${an} в первую очередь про «${VG[va].n.toLowerCase()}», ${bn} — про «${VG[vb].n.toLowerCase()}». ${VCOMBO[[va,vb].sort().join('')]}`;
 h+=sec(CH[0].col,`<div class="kicker">${CH[0].kick}</div><h3>${va===vb?VG[va].n+'<span class="stamp">совпало</span>':'Разные моторы'}</h3><p>${vt}</p><div class="bars">${'SWOD'.split('').map(k=>bar2(VG[k].n,pct(byKey(a.v,k).s),pct(byKey(b.v,k).s))).join('')}</div>${legend}`);
 // спор
 const ka=a.k[0].k,kb=b.k[0].k;
 h+=sec(CH[1].col,`<div class="kicker">${CH[1].kick}</div><h3>${ka===kb?KS[ka].n+'<span class="stamp">совпало</span>':KS[ka].n+' и '+KS[kb].n.toLowerCase()}</h3><p>${an}: ${KS[ka].n.toLowerCase()}. ${bn}: ${KS[kb].n.toLowerCase()}.</p><p>${KCOMBO[[ka,kb].sort().join('')]}</p><div class="bars">${'CLAP'.split('').map(k=>bar2(KS[k].n,pct(byKey(a.k,k).s),pct(byKey(b.k,k).s))).join('')}</div>${legend}`);
 // ритм
 const cc=[a.chrono,b.chrono].sort().join('+');
 const ct={'owl+owl':'Вы оба совы. В три ночи вам всегда есть с кем поговорить. Кто-то один должен иногда говорить «спать».','mid+mid':'У вас обоих гибкий режим. Подстроиться друг под друга вам легко.','lark+lark':'Вы оба жаворонки. Ваше лучшее общее время — утро и день.','lark+owl':'Ваши часы не совпадают: один разгоняется, когда второй уже гаснет. Общее окно у вас — день и ранний вечер, берегите его.','mid+owl':'Режим у вас похожий, но не одинаковый. Тому, кто посередине, подстроиться проще.','lark+mid':'Режим у вас похожий, но не одинаковый. Тому, кто посередине, подстроиться проще.'}[cc];
 const tt=a.tempo===b.tempo?['Вы оба идёте ровно, шаг за шагом. Планировать вместе вам легко.','Вы оба делаете рывком. Вместе это весело, только следите, чтобы два срока не сошлись в одну ночь.','Вы оба работаете волнами. Хорошо, когда волны иногда совпадают.'][a.tempo]:`Темп у вас разный: ${an} — ${TEMPOS[a.tempo]}, ${bn} — ${TEMPOS[b.tempo]}. Не меряйте друг друга своим темпом, смотрите на результат.`;
 const gt=a.charge===b.charge?`Отдыхаете вы одинаково: ${CHARGES[a.charge]}.`:`Отдыхаете по-разному: ${an} — ${CHARGES[a.charge]}, ${bn} — ${CHARGES[b.charge]}. Это стоит просто знать, чтобы не обижаться.`;
 h+=sec(CH[2].col,`<div class="kicker">${CH[2].kick}</div><h3>${a.chrono===b.chrono?RC[a.chrono].n+'<span class="stamp">совпало</span>':RC[a.chrono].n+' и '+RC[b.chrono].n.toLowerCase()}</h3><p>${ct}</p>${line('ночь','утро',mk2(a.m/8,b.m/8,A,B))}<p>${tt}</p><p>${gt}</p>${legend}`);
 // люди
 const dh=x=>x.d>=3,wh=x=>x.w>=3;
 const dt=dh(a)===dh(b)?(dh(a)?'Вы оба подпускаете людей не сразу. Не принимайте осторожность другого на свой счёт: это скорость, а не оценка.':'Вы оба подпускаете людей легко. Сближаться вам просто.'):`${dh(a)?bn:an} сближается быстрее, ${dh(a)?an:bn} дольше присматривается. Тому, кто быстрее: не торопить. Тому, кто осторожнее: иногда говорить вслух, что всё хорошо.`;
 const wt=wh(a)===wh(b)?(wh(a)?'Вы оба замечаете тишину и оба можете накрутить. Простое правило: пропадаешь — предупреди.':'Паузы в переписке никого из вас не пугают.'):`${wh(a)?bn:an} спокойно относится к паузам, ${wh(a)?an:bn} их замечает. Короткое «я в делах, вернусь вечером» стоит дёшево, а работает отлично.`;
 h+=sec(CH[3].col,`<div class="kicker">${CH[3].kick}</div><h3>${PQ[a.quad].n}${a.quad===b.quad?'<span class="stamp">совпало</span>':' и '+PQ[b.quad].n.toLowerCase()}</h3><p>${dt}</p>${line('подпускаю быстро','долго',mk2(a.d/6,b.d/6,A,B))}<p>${wt}</p>${line('паузы не трогают','накручиваю',mk2(a.w/6,b.w/6,A,B))}${legend}`);
 // инструкция
 let rows='';for(let n=0;n<6;n++){rows+=`<div class="pairrow"><b>${INSL[n]}</b>`+(a.i[n]===b.i[n]?`<span class="same">обоим: ${INSS[n][a.i[n]]}</span>`:`<span class="xa">${an}: ${INSS[n][a.i[n]]}</span><span class="xb">${bn}: ${INSS[n][b.i[n]]}</span>`)+`</div>`}
 h+=sec(CH[4].col,`<div class="kicker">две инструкции</div><h3>Как с вами <em>обращаться</em></h3>${rows}<p>${a.i[0]===b.i[0]?'В плохой день вам помогает одно и то же. Удобно.':'В плохой день вам нужно разное. Не утешайте друг друга так, как утешали бы себя.'}</p>`);
 // вопросы
 const q1=va===vb?`Что каждый из вас называет словами «${VG[va].n.toLowerCase()}»? Сравните.`:`${an}, что для тебя значит «${VG[va].n.toLowerCase()}»? ${bn}, а для тебя — «${VG[vb].n.toLowerCase()}»?`;
 h+=sec('#FF4F9A',`<div class="kicker">на вечер</div><h3>Три вопроса <em>друг другу</em></h3><ol class="ask"><li>${q1}</li><li>Вспомните последний спор с кем угодно. Что вам тогда было нужно от другого человека?</li><li>Какой пункт в чужой инструкции вас удивил?</li></ol>`);
 h+=sec('#2E4BE0',`<div class="kicker">поделиться</div><h3>Отправить <em>сравнение</em></h3><p>${ONLINE?'По этой ссылке сравнение откроется на любом телефоне.':'По этим двум кодам сравнение откроется на любом телефоне: их вставляют в поле «у меня есть код».'}</p><button class="btn sm" data-act="share" data-what="pair">Отправить</button><button class="btn sm alt" data-act="copy" data-what="pair">Скопировать</button>`);
 h+=`<p class="foot">Тест короткий, поэтому это набросок, а не диагноз. Разные ответы — не минус: по ним видно, где вам стоит спрашивать друг друга, а не угадывать.</p><button class="link" data-act="home" style="margin-left:4px">в начало</button>`;
 pairNow=[A,B];
 show(h,{long:true,after:el=>{const c=el.querySelector('#cnt'),t0=performance.now()+600;(function f(t){const k=Math.max(0,Math.min(1,(t-t0)/1100));c.textContent=Math.round(tot*k);if(k<1)requestAnimationFrame(f)})(t0)}});
 setTimeout(confetti,500)}
let pairNow=null;

function codeScreen(msg){show(`<div class="kicker">код</div><h1 class="title">Вставь <em>код</em></h1><p class="lead">${ONLINE?'Ссылку или код':'Код'}, который тебе прислали. Если кодов два, сравнение откроется сразу.</p><textarea class="code" id="cd"></textarea><div class="err" id="er">${msg||''}</div><button class="btn" data-act="usecode">Дальше</button><br><button class="link" data-act="home">назад</button>`)}

function useCodes(list){ // вернуть текст ошибки или null
 if(!list.length)return 'Не получилось прочитать. Скопируй целиком.';
 const my=done()?encode(me):null;
 if(list.length>=2){pair(list[0],list[1]);return null}
 const p=list[0];
 if(my&&p.code===my)return 'Это твой собственный результат. Нужен код второго человека.';
 partner=p;LS.set('partner',p);
 if(my)pair(me,p);else cover();return null}

function shareText(what){
 if(what==='pair'&&pairNow){const codes=pairNow.map(encode),l=linkFor(codes);return l?`Наше сравнение в тесте «30 ситуаций»: ${l}`:`Наше сравнение в тесте «30 ситуаций». Коды: ${codes.join(' ')}`}
 const codes=[encode(me)],l=linkFor(codes);return l?`Мой результат теста «30 ситуаций». Пройди тоже, и сравним ответы: ${l}`:`Мой код из теста «30 ситуаций»: ${codes[0]}`}
function copy(text,btn){const ok=()=>{const t=btn.textContent;btn.textContent='Скопировано';setTimeout(()=>btn.textContent=t,1400)};
 const fb=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');ok()}catch(e){prompt('Скопируй:',text)}ta.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,fb);else fb()}

/* ---------- события ---------- */
stage.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
 if(act==='copy')return copy(shareText(b.dataset.what),b);
 if(act==='share'){const text=shareText(b.dataset.what);if(navigator.share)navigator.share({text}).catch(()=>{});else copy(text,b);return}
 if(act==='usecode'){const er=useCodes(extract(document.getElementById('cd').value));if(er)document.getElementById('er').textContent=er;return}
 if(act==='name'){const v=document.getElementById('nm').value.trim().slice(0,12);if(!v){document.getElementById('er').textContent='Напиши имя';return}me.name=v;save();lock=true;return go(firstOpen())}
 if(lock)return;lock=true;
 if(act==='start')nameScreen();
 else if(act==='resume')go(firstOpen());
 else if(act==='again'){if(b.dataset.sure){me={name:me.name,ans:[]};save();nameScreen()}else{b.dataset.sure=1;b.textContent='точно? ответы сотрутся';lock=false}}
 else if(act==='result')result(false);
 else if(act==='pair')pair(me,partner);
 else if(act==='code')codeScreen();
 else if(act==='home')cover();
 else if(act==='q')question(+b.dataset.q);
 else if(act==='back'){const i=+b.dataset.q;if(i===0)nameScreen();else question(i-1)}
 else if(act==='pick'){const i=+b.dataset.q;me.ans[i]=+b.dataset.k;save();b.classList.remove('was');b.classList.add('sel');b.closest('.screen').classList.add('answered');setTimeout(()=>go(i+1),720)}
});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){e.preventDefault();stage.querySelector('[data-act=name]').click()}});

/* ---------- запуск ---------- */
(function init(){
 stage.innerHTML='';
 const list=extract(location.hash?decodeURIComponent(location.hash):'');
 if(list.length){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(list.length>=2)return pair(list[0],list[1]);
  const my=done()?encode(me):null;
  if(list[0].code!==my){partner=list[0];LS.set('partner',partner);if(my)return pair(me,partner)}}
 cover();
})();
</script>
</body>
</html>
